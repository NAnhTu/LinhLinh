<!DOCTYPE html>
<html lang="vi">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Chúc Mừng 20/10</title>
	<meta name="description" content="Một lời chúc 20/10 dịu dàng và đáng nhớ dành tặng Em Bé Yêu 🌸.">
	<meta name="theme-color" content="#f8c8dc">

	<meta property="og:type" content="website">
	<meta property="og:locale" content="vi_VN">
	<meta property="og:site_name" content="Chúc Mừng 20/10">
	<meta property="og:title" content="Chúc Mừng 20/10">
	<meta property="og:description" content="Một lời chúc 20/10 dịu dàng và đáng nhớ dành tặng Em Bé Yêu 🌸.">
	<meta property="og:url" content="https://nanhtu.github.io/LinhLinh/women-day-2026/">
	<meta property="og:image" content="https://nanhtu.github.io/LinhLinh/women-day-2026/assets/images/IMG_2640.jpeg">
	<meta property="og:image:alt" content="Hình ảnh kỷ niệm 20/10">

	<meta name="twitter:card" content="summary_large_image">
	<meta name="twitter:title" content="Chúc Mừng 20/10">
	<meta name="twitter:description" content="Một lời chúc 20/10 dịu dàng và đáng nhớ dành tặng Em Bé Yêu 🌸.">
	<meta name="twitter:image" content="https://nanhtu.github.io/LinhLinh/women-day-2026/assets/images/IMG_2640.jpeg">

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@400;500;700&display=swap"
		rel="stylesheet">
	<link rel="stylesheet" href="stylesheets/style.css">
</head>

<body>
	<div class="petals" id="petals"></div>

	<section class="hero">
		<div class="container">
			<div class="hero-card">
				<div class="left">
					<div class="tag">🌸 Happy Women's Day 20/10 🌸</div>

					<h1 class="title">Chúc mừng 20/10</h1>

					<p class="subtitle">
						Gửi đến Em Bé Yêu 🌸 một ngày thật dịu dàng, thật vui và ngập tràn yêu thương.
					</p>

					<div class="message-box">
						<div class="typing-text" id="typingText"></div>
					</div>

					<div class="footer-note">
						“Em Bé Yêu 🌸 xứng đáng với những điều ngọt ngào nhất ạaaaaa.”
					</div>
				</div>

				<div class="right">
					<div class="gallery-wrap">
						<div class="frame-title">✨ Những khoảnh khắc thật đẹp ✨</div>

						<div class="main-photo" id="mainPhoto">
							<img src="assets/images/IMG_2640.jpeg" class="active" alt="Ảnh 1">
							<img src="assets/images/IMG_7429.jpeg" alt="Ảnh 2">
							<img src="assets/images/IMG_2819.jpeg" alt="Ảnh 3">

							<div class="soft-light"></div>
							<div class="glow"></div>
							<div class="hearts" id="hearts"></div>
						</div>

						<div class="thumbs">
							<div class="thumb active" data-index="0">
								<img src="assets/images/IMG_2640.jpeg" alt="Ảnh nhỏ 1">
							</div>
							<div class="thumb" data-index="1">
								<img src="assets/images/IMG_7429.jpeg" alt="Ảnh nhỏ 2">
							</div>
							<div class="thumb" data-index="2">
								<img src="assets/images/IMG_2819.jpeg" alt="Ảnh nhỏ 3">
							</div>
						</div>

						<div class="hint">Bấm vào ảnh nhỏ để đổi ảnh</div>
					</div>
				</div>
			</div>
		</div>
	</section>

	<button class="music-btn" id="musicBtn" type="button">🎵 Bật nhạc</button>

	<audio id="bgMusic" loop>
		<source src="assets/audios/ThanhTan.mp3" type="audio/mpeg">
	</audio>

	<script src="javascripts/script.js"></script>
</body>

</html>
